name: Check connection

on:
  workflow_dispatch:
    inputs:
      headline:
        description: "Optional: test which players in this headline can be tagged"
        type: string
        default: ""

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check token, accounts and permissions (read-only, posts nothing)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_API_ROUTE: ${{ vars.IG_API_ROUTE }}
          HEADLINE: ${{ inputs.headline }}
        run: |
          python bot.py check | tee -a "$GITHUB_STEP_SUMMARY"
          python bot.py collabs | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -n "$HEADLINE" ]; then python bot.py tags "$HEADLINE" | tee -a "$GITHUB_STEP_SUMMARY"; fi
