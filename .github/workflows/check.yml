name: Check connection

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check token, accounts and permissions (read-only, posts nothing)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_API_ROUTE: ${{ vars.IG_API_ROUTE }}
        run: python bot.py check | tee -a "$GITHUB_STEP_SUMMARY"
