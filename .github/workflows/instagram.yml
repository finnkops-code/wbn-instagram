name: Instagram autopost

on:
  schedule:
    - cron: "7 */3 * * *"   # every 3 hours (01/04/07/10/13/16/19/22 NL winter time); max 3 posts/day
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only create the visual + caption, don't post"
        type: boolean
        default: false
      url:
        description: "Optional: post this specific article instead of the automatic pick"
        type: string
        default: ""
      collaborators:
        description: "Optional: Instagram collaborators for that article, comma separated (max 3)"
        type: string
        default: ""
      force:
        description: "Post the best available story now, ignoring score thresholds and time windows (daily max still applies)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: instagram-autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pick headline, render visual + caption
        id: prep
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run == true }}
          FORCE_POST: ${{ inputs.force == true }}
          ARTICLE_URL: ${{ inputs.url }}
          COLLABORATORS: ${{ inputs.collaborators }}
        run: |
          if [ -n "$ARTICLE_URL" ]; then python bot.py prepare-url "$ARTICLE_URL"; else python bot.py prepare; fi

      - name: Upload visual (Instagram fetches it from the public raw URL)
        id: upload
        if: steps.prep.outputs.has_post == 'true'
        run: |
          git config user.name  "wbn-instagram-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts/
          git diff --cached --quiet || (git commit -m "Visual: $(jq -r .headline pending.json)" && git pull --rebase -q && git push)
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "### Caption" >> $GITHUB_STEP_SUMMARY
          jq -r .caption pending.json >> $GITHUB_STEP_SUMMARY

      - name: Publish to Instagram
        if: steps.prep.outputs.has_post == 'true' && inputs.dry_run != true
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_API_ROUTE: ${{ vars.IG_API_ROUTE }}
          IMAGE_SHA: ${{ steps.upload.outputs.sha }}
        run: python bot.py publish

      - name: Save posting log
        if: steps.prep.outputs.has_post == 'true' && inputs.dry_run != true
        run: |
          git add -A state/ posts/
          git diff --cached --quiet || (git commit -m "Posted to Instagram" && git pull --rebase -q && git push)
