name: Fetch league logos (one-off)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests cairosvg Pillow
      - run: python tools/fetch_league_logos.py
      - run: |
          git config user.name  "wbn-instagram-bot"
          git config user.email "actions@users.noreply.github.com"
          git add league-logos/
          git diff --cached --quiet || (git commit -m "League logos" && git pull --rebase -q && git push)
