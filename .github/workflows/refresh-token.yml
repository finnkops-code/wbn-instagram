name: Refresh Instagram token

on:
  schedule:
    - cron: "17 3 * * 1"   # every Monday; tokens last 60 days, so this keeps it alive forever
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Refresh token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_ROUTE: ${{ vars.IG_API_ROUTE }}
        run: python bot.py refresh-token
      - name: Store new token as repo secret
        if: hashFiles('new_token.txt') != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < new_token.txt
          rm new_token.txt
